services:
  postgres:
    image: postgres:16
    container_name: stay-ops-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: stayops
      POSTGRES_USER: stayops
      POSTGRES_PASSWORD: stayops1234
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stayops -d stayops"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
