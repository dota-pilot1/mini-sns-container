services:
  postgres:
    image: postgres:16
    container_name: fs-admin-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: fsadmin
      POSTGRES_USER: fsadmin
      POSTGRES_PASSWORD: fsadmin1234
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fsadmin -d fsadmin"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
