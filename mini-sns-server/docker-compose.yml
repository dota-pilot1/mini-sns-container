services:
  postgres:
    image: postgres:16
    container_name: mini-sns-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: minisns
      POSTGRES_USER: minisns
      POSTGRES_PASSWORD: minisns1234
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U minisns -d minisns"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
